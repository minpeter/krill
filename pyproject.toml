[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
no-build-isolation-package = ['flash-attn', 'setuptools']

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "krill"
version = "0.1.0"
description = "🦐 A minimal pretraining trainer for LLMs — from scratch."
authors = [{ name = "minpeter", email = "kali2005611@gmail.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.1",
    "datasets>=5.0.0",
    "hf-transfer>=0.1.9",
    "torch==2.7.1",
    "transformers>=5.12.1",
    "trl>=1.9.2",
    "wandb>=0.21.0",
    "PyYAML>=5.4.1",
    "pydantic>=1.10.0",
    "muon-optimizer",
    "pytorch-optimizer>=3.7.0",
    "accelerate>=1.14.0",
    "lm-eval[wandb]>=0.4.12",
]

[project.optional-dependencies]
cuda = ["triton>=3.7.1", "flash-attn==2.8.3.post1", "liger-kernel>=0.8.0"]

[tool.uv.sources]
muon-optimizer = { git = "https://github.com/KellerJordan/Muon" }

[project.scripts]
krill = "krill.main:cli"
kr = "krill.main:cli"
